name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-github-packages:
    name: Publish on registry
    runs-on: ubuntu-latest
    if: success() && !contains(github.ref, 'beta')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Get tag
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node env 🏗
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies 👨🏻‍💻
        run: pnpm i --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upgrade npm
        run: pnpm add -g npm@11.11.0

      - name: Publish packages to npm
        run: |
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ]; then
              PRIVATE=$(node -e "console.log(require('./$pkg/package.json').private || false)")
              if [ "$PRIVATE" = "false" ]; then
                NAME=$(node -e "console.log(require('./$pkg/package.json').name)")
                VERSION=$(node -e "console.log(require('./$pkg/package.json').version)")
                if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                  echo "Already published: $NAME@$VERSION — skipping"
                  continue
                fi
                echo "Publishing $NAME@$VERSION"
                cd "$pkg"
                npm publish --access public --provenance
                cd "$GITHUB_WORKSPACE"
              fi
            fi
          done
